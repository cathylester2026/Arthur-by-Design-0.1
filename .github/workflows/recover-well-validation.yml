name: Recover Well validation
on:
  push:
    branches:
      - feature/recover-well-arthur-continuity
  pull_request:
    paths:
      - 'src/recoverWell/**'
      - 'tests/recoveryChapterClosing.test.mjs'
      - 'package.json'
      - 'package-lock.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
