name: Live Well browser acceptance
on:
  push:
    branches:
      - feature/live-well-causal-engine
  pull_request:
    paths:
      - 'src/liveWell/**'
      - 'src/journeyViews.js'
      - 'src/parityRouter.js'
      - 'src/landingExperience.js'
      - 'scripts/live-well-browser-acceptance.mjs'
jobs:
  phone-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          (npm run dev -- --host 127.0.0.1 --port 4177 > /tmp/arthur-vite.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4177/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/arthur-vite.log
          exit 1
      - run: node scripts/live-well-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-well-browser-screens
          path: /tmp/arthur-live-browser
          if-no-files-found: ignore
