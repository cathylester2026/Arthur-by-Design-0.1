name: Mobile and facilitated chapter acceptance
on:
  push:
    branches:
      - feature/mobile-facilitated-journey
  pull_request:
    paths:
      - 'src/mobileChoicePager.js'
      - 'src/mobileJourney.css'
      - 'src/studioSolo.js'
      - 'src/journeyViews.js'
      - 'src/recoverWell/**'
      - 'scripts/recover-well-browser-acceptance.mjs'
jobs:
  rules-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: |
          (npm run dev -- --host 127.0.0.1 --port 4177 > /tmp/arthur-vite.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4177/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/arthur-vite.log
          exit 1
      - run: node scripts/recover-well-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-facilitated-screen-captures
          path: /tmp/arthur-browser-artifacts
          if-no-files-found: ignore
