name: Live Well causal engine validation
on:
  push:
    branches:
      - feature/live-well-causal-engine
  pull_request:
    paths:
      - 'src/liveWell/**'
      - 'tests/liveWellResolver.test.mjs'
      - 'tests/designLegacyFiveEndToEnds.test.mjs'
      - 'src/designLegacy.js'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
